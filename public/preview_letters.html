<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Logo Faithful Letters Preview</title>
  <style>
    body {
      background: #080c16;
      color: white;
      font-family: 'Cairo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .title {
      font-size: 24px;
      font-weight: 900;
      color: #f59e0b;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .original-logo-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(224, 148, 1, 0.3);
      border-radius: 20px;
      padding: 16px 30px;
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .original-logo-box img {
      height: 80px;
      object-fit: contain;
    }
    .grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 200px);
      gap: 20px;
    }
    .letter-card {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(224, 148, 1, 0.4);
      border-radius: 28px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px;
      box-shadow: 0 10px 30px -5px rgba(224, 148, 1, 0.15);
      transition: transform 0.2s;
    }
    .letter-card:hover {
      transform: scale(1.04);
      border-color: #e09401;
    }
    .badge {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 11px;
      font-weight: 900;
      color: #f59e0b;
    }
    svg {
      width: 150px;
      height: 150px;
      overflow: visible;
    }
    .eye-white {
      fill: #ffffff;
      stroke: #cbd5e1;
      stroke-width: 1.5;
    }
    .eye-pupil {
      fill: #090d16;
    }
    .eye-glint {
      fill: #ffffff;
    }
  </style>
</head>
<body>
  <div class="title">حروف كلمة «ط - ر - ق - ع» المتطابقة مع هوية الشعار</div>
  <div class="subtitle">مبنية بأسلوب الخط الممتلئ المنحني مع نهايات دائرية ونفس اللون الذهبي #e09401</div>

  <div class="original-logo-box">
    <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 8px;">الشعار المرجعي الأصلي:</div>
    <img src="/tarqa_clean_logo.png" alt="الشعار الأصلي">
  </div>

  <div class="grid-2x2">
    <!-- 1. حرف ط (أعلى اليمين) -->
    <div class="letter-card">
      <span class="badge">ط</span>
      <svg viewBox="0 0 200 200">
        <path d="M 86 18 C 78 60, 68 105, 62 165" fill="none" stroke="#e09401" stroke-width="24" stroke-linecap="round"/>
        <path d="M 62 135 C 100 88, 162 82, 178 122 C 192 154, 160 186, 105 180 C 75 177, 56 162, 50 148" fill="none" stroke="#e09401" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 125 180 C 145 185, 155 200, 142 208 C 130 214, 115 198, 105 180" fill="#e09401"/>

        <g transform="translate(108, 138)">
          <ellipse cx="-10" cy="0" rx="9" ry="12" class="eye-white"/>
          <circle cx="-9" cy="0" r="5" class="eye-pupil"/>
          <circle cx="-7" cy="-3" r="2" class="eye-glint"/>

          <ellipse cx="10" cy="0" rx="9" ry="12" class="eye-white"/>
          <circle cx="11" cy="0" r="5" class="eye-pupil"/>
          <circle cx="13" cy="-3" r="2" class="eye-glint"/>
        </g>
      </svg>
    </div>

    <!-- 2. حرف ر (أعلى اليسار) -->
    <div class="letter-card">
      <span class="badge">ر</span>
      <svg viewBox="0 0 200 200">
        <path d="M 152 46 C 138 95, 108 146, 56 162 C 40 166, 28 156, 26 142" fill="none" stroke="#e09401" stroke-width="26" stroke-linecap="round"/>

        <g transform="translate(112, 88)">
          <ellipse cx="-9" cy="0" rx="9" ry="12" class="eye-white"/>
          <circle cx="-8" cy="0" r="5" class="eye-pupil"/>
          <circle cx="-6" cy="-3" r="2" class="eye-glint"/>

          <ellipse cx="10" cy="0" rx="9" ry="12" class="eye-white"/>
          <circle cx="11" cy="0" r="5" class="eye-pupil"/>
          <circle cx="13" cy="-3" r="2" class="eye-glint"/>
        </g>
      </svg>
    </div>

    <!-- 3. حرف ق (أسفل اليمين) -->
    <div class="letter-card">
      <span class="badge">ق</span>
      <svg viewBox="0 0 200 200">
        <circle cx="82" cy="34" r="13" fill="#e09401"/>
        <circle cx="116" cy="30" r="13" fill="#e09401"/>

        <circle cx="100" cy="100" r="32" fill="none" stroke="#e09401" stroke-width="24"/>
        <path d="M 124 108 C 128 142, 110 172, 68 172" fill="none" stroke="#e09401" stroke-width="24" stroke-linecap="round"/>

        <g transform="translate(100, 100)">
          <ellipse cx="-8" cy="0" rx="8" ry="11" class="eye-white"/>
          <circle cx="-7" cy="0" r="4.5" class="eye-pupil"/>
          <circle cx="-5" cy="-2.5" r="1.8" class="eye-glint"/>

          <ellipse cx="8" cy="0" rx="8" ry="11" class="eye-white"/>
          <circle cx="9" cy="0" r="4.5" class="eye-pupil"/>
          <circle cx="11" cy="-2.5" r="1.8" class="eye-glint"/>
        </g>
      </svg>
    </div>

    <!-- 4. حرف ع (أسفل اليسار) -->
    <div class="letter-card">
      <span class="badge">ع</span>
      <svg viewBox="0 0 200 200">
        <path d="M 52 75 C 68 45, 118 42, 138 68 C 148 82, 130 102, 94 102" fill="none" stroke="#e09401" stroke-width="23" stroke-linecap="round"/>
        <path d="M 94 102 C 145 118, 160 162, 132 188 C 105 210, 52 205, 26 168" fill="none" stroke="#e09401" stroke-width="25" stroke-linecap="round"/>

        <g transform="translate(96, 68)">
          <ellipse cx="-8" cy="0" rx="8" ry="11" class="eye-white"/>
          <circle cx="-7" cy="0" r="4.5" class="eye-pupil"/>
          <circle cx="-5" cy="-2.5" r="1.8" class="eye-glint"/>

          <ellipse cx="8" cy="0" rx="8" ry="11" class="eye-white"/>
          <circle cx="9" cy="0" r="4.5" class="eye-pupil"/>
          <circle cx="11" cy="-2.5" r="1.8" class="eye-glint"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
