<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Changa:wght@800&family=Cairo:wght@900&display=swap" rel="stylesheet">
  <title>Test Font and Layout for طر and قع</title>
  <style>
    body {
      background: #0b101b;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      font-family: sans-serif;
    }
    .option-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 320px;
    }
    .baloo {
      font-family: 'Baloo Bhaijaan 2', cursive;
      font-weight: 800;
      color: #e09401;
      line-height: 0.9;
    }
    .changa {
      font-family: 'Changa', sans-serif;
      font-weight: 800;
      color: #e09401;
      line-height: 0.9;
    }
    .cairo {
      font-family: 'Cairo', sans-serif;
      font-weight: 900;
      color: #e09401;
      line-height: 0.9;
    }
    .word-row {
      font-size: 110px;
      position: relative;
      user-select: none;
      filter: drop-shadow(0 8px 16px rgba(224, 148, 1, 0.35));
    }
    .eye {
      width: 18px;
      height: 24px;
      background: white;
      border: 2px solid #0f172a;
      border-radius: 9999px;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .pupil {
      width: 9px;
      height: 9px;
      background: #0f172a;
      border-radius: 9999px;
      position: relative;
    }
    .pupil::after {
      content: '';
      position: absolute;
      top: 1px;
      right: 1px;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <h2>معاينة «طر» بالأعلى و«قع» بالأسفل بدون بوكسات</h2>

  <div style="display: flex; gap: 30px;">
    <!-- خيار 1: Baloo Bhaijaan 2 (خط عربي مدور ممتلئ مطابق لأسلوب الشعار) -->
    <div class="option-card">
      <div style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">Baloo Bhaijaan 2 (مدور ممتلئ)</div>
      <div class="baloo">
        <!-- السطر الأول: طر -->
        <div class="word-row" style="margin-bottom: -15px;">
          <span>طر</span>
          <!-- عيون على طر -->
          <div class="eye" style="top: 42px; right: 58px;"><div class="pupil"></div></div>
          <div class="eye" style="top: 42px; right: 78px;"><div class="pupil"></div></div>
        </div>

        <!-- السطر الثاني: قع تحتيهم -->
        <div class="word-row">
          <span>قع</span>
          <!-- عيون على قع -->
          <div class="eye" style="top: 48px; right: 46px;"><div class="pupil"></div></div>
          <div class="eye" style="top: 48px; right: 66px;"><div class="pupil"></div></div>
        </div>
      </div>
    </div>

    <!-- خيار 2: Cairo 900 -->
    <div class="option-card">
      <div style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">Cairo Black 900</div>
      <div class="cairo">
        <div class="word-row" style="margin-bottom: -10px;">
          <span>طر</span>
          <div class="eye" style="top: 46px; right: 55px;"><div class="pupil"></div></div>
          <div class="eye" style="top: 46px; right: 75px;"><div class="pupil"></div></div>
        </div>
        <div class="word-row">
          <span>قع</span>
          <div class="eye" style="top: 45px; right: 42px;"><div class="pupil"></div></div>
          <div class="eye" style="top: 45px; right: 62px;"><div class="pupil"></div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
